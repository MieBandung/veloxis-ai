version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: veloxis-backend
    ports:
      - "8000:8000"
    environment:
      - AI_MODE=${AI_MODE:-mock}
      - BASE_MODEL=${BASE_MODEL:-Qwen/Qwen2.5-VL-3B-Instruct}
      - ADAPTER_PATH=${ADAPTER_PATH:-./models/qwen-veloxis/epoch-1}
      - MAX_NEW_TOKENS=${MAX_NEW_TOKENS:-512}
    volumes:
      - .:/app
    restart: unless-stopped
