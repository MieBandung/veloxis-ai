services:
  backend:
    build: ./backend
    tty: true
    stdin_open: true
    ports:
      - "8000:8000"
    environment:
      PYTHONUNBUFFERED: "1"
      HF_HUB_DISABLE_PROGRESS_BARS: "0"
      AI_MODE: ${AI_MODE:-qwen}
      BASE_MODEL: ${BASE_MODEL:-Qwen/Qwen2.5-VL-3B-Instruct}
      ADAPTER_PATH: /app/models/qwen-veloxis/best_adapter
      HF_HOME: /root/.cache/huggingface
      MAX_NEW_TOKENS: ${MAX_NEW_TOKENS:-512}
      LOAD_IN_4BIT: ${LOAD_IN_4BIT:-true}
      HF_TOKEN: ${HF_TOKEN:-}
    volumes:
      # LoRA adapter stays on the host; it is never baked into the image.
      - ./backend/models/qwen-veloxis/best_adapter:/app/models/qwen-veloxis/best_adapter:ro
      # Base model is downloaded once by Transformers and cached here.
      - hf-cache:/root/.cache/huggingface
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  frontend:
    build:
      context: ./frontend
      args:
        # Browser-side URL: the user's machine reaches the backend on localhost:8000.
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  hf-cache:
